# Snakes of Honour, Wipe analyser -- per-boss mechanics.
#
# EVERY spell id here was read out of this guild's own combat logs (see
# tools/mine_spells.py), never from a spell database, so they are guaranteed to
# match this client build. Regenerate candidates for a new boss with:
#
#     python tools/mine_spells.py <logfile> <encounter_id>
#
# This file is meant to be edited by a raider, not a developer. If the tool
# says something wrong about a mechanic, the fix is almost always here rather
# than in the code.
#
# Fields
# ------
#   avoidable      damage a player should not be taking at all. Each hit is a
#                  leading indicator that someone is about to die.
#   count:         `hits`         - count every damage event (default)
#                  `applications` - count debuff applications instead.
#                  Use `applications` for anything that ticks. A damage-over-
#                  time mechanic logs hundreds of ticks and would otherwise
#                  drown out every real mistake -- the same trap as counting a
#                  channelled spell's ticks as casts.
#   tank_busters   big hits aimed at the current threat target.
#   expect_cooldown  true if a tank should have a defensive up for it; drives
#                  the "died with no cooldown used" verdict.
#   interruptible  enemy casts the raid is expected to stop.
#   verified:      false means "this had a cast bar in the log, but nobody has
#                  confirmed it can actually be interrupted". Findings from
#                  unverified entries are labelled as such rather than asserted.

schema_version: 1

bosses:

  korkron_dark_shaman:
    encounter_id: 1606
    display_name: "Kor'kron Dark Shaman"
    # Two bosses share the encounter; both must die.
    boss_units: ["Earthbreaker Haromm", "Wavebinder Kardris"]

    avoidable:
      # Tank share of hits is the test for whether a mechanic follows whoever
      # is holding the boss. With 3 tanks in 24 raiders, ~12% is what an
      # untargeted mechanic looks like. Toxic Storm 18%, Falling Ash 14%,
      # Toxic Tornado 12%, Foul Stream 17% -- all untargeted, no exemption.
      - {spell_id: 144017, name: "Toxic Storm",   count: hits}
      - {spell_id: 144030, name: "Toxic Tornado", count: hits}
      - {spell_id: 143987, name: "Falling Ash",   count: hits}
      - {spell_id: 144334, name: "Iron Tomb",     count: hits}
      - {spell_id: 144331, name: "Iron Prison",   count: hits}
      # 54% of its hits land on tanks, four times what an untargeted mechanic
      # would give them. It follows the threat target, so the tanks are not
      # dodging it by choice.
      - {spell_id: 143993, name: "Foul Geyser",   count: hits,
         exempt_roles: [tank]}
      # Ticking pools. 708 ticks across 21 players in one pull -- counted by
      # application, or this single mechanic outweighs everything else.
      - {spell_id: 144089, name: "Toxic Mist", count: applications}
      - {spell_id: 144066, name: "Foulness",   count: applications}
      - {spell_id: 144090, name: "Foul Stream", count: applications}

    tank_busters:
      - {spell_id: 144215, name: "Froststorm Strike", expect_cooldown: true}
      - {spell_id: 144214, name: "Froststorm Bolt",   expect_cooldown: false}

    interruptible:
      - {spell_id: 144214, name: "Froststorm Bolt", verified: false}

  thok_the_bloodthirsty:
    encounter_id: 1599
    display_name: "Thok the Bloodthirsty"
    boss_units: ["Thok the Bloodthirsty"]
    seeded_from: "25 Heroic, 2026-08-02 (9 pulls)"

    avoidable:
      # Frontal breath. Unavoidable for whoever is holding the boss -- across
      # the 02/08 pulls the two tanks took 121 of 223 hits (54%) simply by
      # being in front of it, while the other 102 were spread over 17 raiders.
      # Counting it against the tanks blames them for tanking.
      - {spell_id: 143773, name: "Freezing Breath", count: hits,
         exempt_roles: [tank]}
      # Hits behind the boss, so the tanks are the ones who CAN'T be caught by
      # it: they took 2 of 26. No exemption.
      - {spell_id: 143428, name: "Tail Lash",       count: hits}
      - {spell_id: 143800, name: "Icy Blood",       count: applications}
    # Deliberately NOT listed as avoidable, though they are the biggest damage
    # sources in the fight: Deafening Screech (143343, 4966 hits on 25 players),
    # Shock Blast (143707), Corrosive Blood (143791) and Vampiric Frenzy
    # (147978) are unavoidable raid-wide damage. Listing them would put all 25
    # raiders at the top of the avoidable table every single pull and bury the
    # three mechanics anyone can actually do something about.

    tank_busters:
      - {spell_id: 143780, name: "Acid Breath",   expect_cooldown: true}
      - {spell_id: 143426, name: "Fearsome Roar", expect_cooldown: false}
      - {spell_id: 144067, name: "Blood Frenzy",  expect_cooldown: true}

    # No interruptible casts asserted. Thok casts Deafening Screech 226 times a
    # pull and Fixate 77 times, but nothing in the log shows the raid
    # interrupting either, and a cast bar alone is not evidence that a cast can
    # be stopped. Add entries here if that is wrong.
    interruptible: []

  # -------------------------------------------------------------------------
  # Everything below was seeded the same way: mine the guild's own logs, then
  # apply the tank-share test. A mechanic whose hits land on tanks far more
  # often than the tanks' share of the raid follows the threat target, so the
  # tanks are not choosing to stand in it. Near-100% ones become tank busters
  # outright; broader ones stay avoidable with the tanks exempted.
  # Mechanics that hit essentially the whole raid every pull are OMITTED, with
  # a note recording which and why so nobody re-adds them next month.
  # -------------------------------------------------------------------------

  general_nazgrim:
    encounter_id: 1603
    display_name: "General Nazgrim"
    boss_units: ["General Nazgrim"]
    seeded_from: "25 Heroic, 2026-07-30 + 2026-07-09 (4 pulls)"

    avoidable:
      - {spell_id: 143716, name: "Heroic Shockwave", count: hits}
      - {spell_id: 143887, name: "Multi-Shot",       count: hits}
      - {spell_id: 143884, name: "Shoot",            count: hits}
      - {spell_id: 143873, name: "Ravager",          count: hits}
      - {spell_id: 143712, name: "Aftershock",       count: hits}
      # 36% of hits on tanks against ~10% expected: the Ironblade's whirlwind
      # follows whoever is holding it.
      - {spell_id: 143421, name: "Ironstorm", count: hits, exempt_roles: [tank]}
    # OMITTED as unavoidable raid damage: Bonecracker (143638 - 2921 hits
    # across 27 players, 0% on tanks) and War Song (143503 - every raider in
    # the sample). Either one would bury everything actionable.

    tank_busters:
      - {spell_id: 143494, name: "Sundering Blow", expect_cooldown: true}
      - {spell_id: 143502, name: "Execute",        expect_cooldown: true}

    interruptible:
      # Arcweavers cast this 37 times across the sample and the raid never
      # interrupted one. Unverified: a cast bar is not proof it can be stopped.
      - {spell_id: 143432, name: "Arcane Shock", verified: false}

  malkorok:
    encounter_id: 1595
    display_name: "Malkorok"
    boss_units: ["Malkorok"]
    seeded_from: "25 Heroic, 2026-07-05 (13 pulls)"

    avoidable:
      - {spell_id: 142816, name: "Breath of Y'Shaarj", count: hits}
      - {spell_id: 142815, name: "Arcing Smash",       count: hits}
      - {spell_id: 142849, name: "Seismic Slam",       count: hits}
      # Dispelled 5 times in the sample, so the missed-dispel check picks this
      # up by itself -- the dispellable set is derived from behaviour, not listed.
      - {spell_id: 142913, name: "Displaced Energy",   count: hits}
    # OMITTED as unavoidable: Essence of Y'Shaarj (143857) and Ancient Miasma
    # (142906).

    # Malkorok opens tears (7 per cast in 25-player) that must be stood in.
    # Soaking one costs the soaker; letting one implode unsoaked costs the
    # WHOLE RAID. Both halves log as "Imploding Energy" under different ids,
    # and the guild's own logs match the tooltip exactly:
    #   142986 - the soak. Median 2 players per burst (range 1-7, i.e. the
    #            tears), median damage exactly 585,000.
    #   142987 - the failure. Median 14 players and up to 24, median damage
    #            728,089, which is the 688,500 raid-wide punishment at heroic.
    # Both were previously in the avoidable list, which was wrong twice over:
    # it blamed soakers for soaking, and blamed all 25 raiders for one tear
    # nobody covered.
    soaks:
      - {spell_id: 142986, name: "Imploding Energy", fail_spell_id: 142987,
         per_cast: 7,
         note: "soaking is correct play and is never counted against anyone"}

    # Unavoidable, but SPLIT between everyone it hits, so it is not nothing:
    # the fewer players soak it, the harder each one is hit. Not a positioning
    # failure, so it stays out of the avoidable table -- the tool reports how
    # many shared each cast instead.
    shared_damage:
      - {spell_id: 142890, name: "Blood Rage", expect_share: 0.7,
         note: "damage divided between everyone hit; missing soakers hurt the rest"}

    tank_busters: []
    interruptible: []

  spoils_of_pandaria:
    encounter_id: 1594
    display_name: "Spoils of Pandaria"
    # No single health bar, so the "closest we got" percentage means nothing
    # here. Everything else works; ignore that one number on this encounter.
    boss_units: []
    seeded_from: "25 Heroic, 2026-08-02 (11 pulls)"

    avoidable:
      - {spell_id: 148583, name: "Jade Tempest",     count: hits}
      - {spell_id: 148514, name: "Fracture",         count: hits}
      - {spell_id: 148517, name: "Molten Fist",      count: hits}
      - {spell_id: 148516, name: "Shadow Volley",    count: hits}
      - {spell_id: 146217, name: "Keg Toss",         count: hits}
      - {spell_id: 145716, name: "Gusting Bomb",     count: hits}
      - {spell_id: 145718, name: "Gusting Bomb",     count: hits}
      - {spell_id: 145817, name: "Windstorm",        count: hits}
      - {spell_id: 145514, name: "Return to Stone",  count: hits}
      - {spell_id: 145993, name: "Set to Blow",      count: hits}
      - {spell_id: 146257, name: "Path of Blossoms", count: hits}
      - {spell_id: 142775, name: "Nova",             count: hits}
      - {spell_id: 146815, name: "Supernova",        count: hits}
      - {spell_id: 145240, name: "Forbidden Magic",  count: hits, exempt_roles: [tank]}
      - {spell_id: 145706, name: "Throw Explosives", count: hits, exempt_roles: [tank]}
    # OMITTED as unavoidable: Pheromone Cloud (148760 - 11,754 hits across
    # eleven pulls), Encapsulated Pheromones (145748) and Torment (136885).

    tank_busters: []
    interruptible: []

  paragons_of_the_klaxxi:
    encounter_id: 1593
    display_name: "Paragons of the Klaxxi"
    boss_units: []
    # THIN DATA: the guild has no heroic Paragons logged. Spell ids do not
    # change with difficulty so these are valid, but none of it has been seen
    # at heroic damage levels.
    seeded_from: "25 Normal, 2026-08-09 (1 pull)"

    avoidable:
      - {spell_id: 143735, name: "Caustic Amber",    count: hits}
      - {spell_id: 144839, name: "Multi-Shot",       count: hits}
      - {spell_id: 143666, name: "Diminish",         count: hits}
      - {spell_id: 143702, name: "Whirling",         count: hits}
      - {spell_id: 143701, name: "Whirling",         count: hits}
      - {spell_id: 142950, name: "Fire",             count: hits}
      - {spell_id: 143768, name: "Sonic Projection", count: hits}
      - {spell_id: 143362, name: "Feed",             count: hits}

    tank_busters:
      - {spell_id: 142930, name: "Razor Sharp Blades",  expect_cooldown: true}
      - {spell_id: 142922, name: "Razor Sharp Blades",  expect_cooldown: true}
      - {spell_id: 143979, name: "Vicious Assault",     expect_cooldown: true}
      - {spell_id: 142929, name: "Tenderizing Strikes", expect_cooldown: true}
      - {spell_id: 143941, name: "Mutilate",            expect_cooldown: true}
      - {spell_id: 143278, name: "Genetic Alteration",  expect_cooldown: false}
      - {spell_id: 143339, name: "Injection",           expect_cooldown: false}

    interruptible: []

  garrosh_hellscream:
    encounter_id: 1623
    display_name: "Garrosh Hellscream"
    boss_units: ["Garrosh Hellscream"]
    # THIN DATA: no heroic Garrosh logged, and the sample mixes 25 and 10
    # Normal, so the damage behind these is not heroic damage.
    seeded_from: "25 Normal 2026-08-09 + 10 Normal 2026-06-30 (5 pulls)"

    avoidable:
      - {spell_id: 144758, name: "Desecrate",           count: hits}
      - {spell_id: 144762, name: "Desecrated",          count: hits}
      - {spell_id: 144817, name: "Desecrated",          count: hits}
      - {spell_id: 144650, name: "Iron Star Impact",    count: hits}
      - {spell_id: 144798, name: "Exploding Iron Star", count: hits}
      - {spell_id: 145199, name: "Explosive Despair",   count: hits}
      - {spell_id: 145033, name: "Empowered Whirling Corruption", count: hits}
      # Annihilate is TWO mechanics under one spell id (tooltip): 3.5m to
      # anyone in a 50-yard cone in front of Garrosh, and 700k to everyone in
      # the Realm of Y'Shaarj. Only the cone is a mistake.
      #
      # The threshold separates them, and the logs say it is safe: across 523
      # Annihilate hits in five pulls the maximum was 367,836, and NOT ONE
      # exceeded 500k. That whole distribution is the 700k realm pulse after
      # mitigation (~292k at 25, ~180k at 10). A 3.5m cone cannot mitigate down
      # anywhere near 800k, so this counts cone hits only and stays silent
      # while the raid keeps dodging it -- which, on this evidence, it always
      # has.
      - {spell_id: 144969, name: "Annihilate (cone)", count: hits,
         amount_at_least: 800000}
    # OMITTED as unavoidable: Whirling Corruption (144989 - 1112 hits on all
    # 28 raiders).
    #
    # Annihilate is handled in the avoidable list above, by damage threshold.
    # Two dead ends recorded so they are not re-attempted:
    #   * It is NOT shared damage -- per-player damage is flat whether 25 or 2
    #     players are hit, where a split would be about twelve times.
    #   * Position does NOT separate the cone from the pulse. Hits inside a
    #     120-degree frontal arc measured LOWER median damage (180k) than hits
    #     outside it (259k), and big and small hits sat at near-identical
    #     median angles (113 vs 106 degrees). Garrosh turns constantly, so his
    #     sampled facing cannot reconstruct where the cone pointed when it
    #     fired. The threshold works and this does not.
    # Also: the number of players hit per burst falls during a sequence
    # (25 -> 20 -> 16). That is people entering and leaving the Realm of
    # Y'Shaarj, which is who the 700k pulse hits -- NOT people dodging.

    tank_busters:
      # 100% of hits land on tanks: this is the tank debuff, not a positioning
      # failure, so it belongs here rather than in the avoidable table.
      - {spell_id: 145183, name: "Gripping Despair",           expect_cooldown: true}
      - {spell_id: 145195, name: "Empowered Gripping Despair", expect_cooldown: true}
      - {spell_id: 144582, name: "Hamstring",                  expect_cooldown: false}

    interruptible: []

  siegecrafter_blackfuse:
    encounter_id: 1601
    display_name: "Siegecrafter Blackfuse"
    boss_units: ["Siegecrafter Blackfuse"]
    # Seeded from a 25 Normal kill (8/9) -- the guild has no heroic Blackfuse
    # logged yet. Spell ids do not change with difficulty, so these are valid;
    # the damage numbers behind them are not heroic numbers.
    seeded_from: "25 Normal, 2026-08-09"

    # Classified by the raid leader on 16/08 after six heroic pulls.
    avoidable:
      # Fire left on the ground by the laser. Counted by application, because
      # standing in it once is one mistake however long the tick list is.
      - {spell_id: 143856, name: "Superheated",     count: applications}
      # A crawler mine reaching its target.
      - {spell_id: 143002, name: "Detonate!",       count: hits}
      # Blackfuse's sawblade. Established from tonight's log: 100% of the 96
      # player hits landed within 25s of a Launch Sawblade cast, median lag
      # 0.7s, and the bleed left on the Automated Shredder (143328) follows the
      # same casts at median 7.2s as the blade travels on. Not proximity to the
      # Shredder -- victims were a median 20m away from it. Dodge the blade.
      - {spell_id: 143327, name: "Serrated Slash",  count: hits}
      - {spell_id: 144210, name: "Death From Above", count: hits}
    # OMITTED - Overload (145444) is NOT avoidable. It is scheduled raid damage
    # that needs a raid cooldown, so it belongs to the damage-window analysis
    # rather than the avoidable table. Listing it told 25 raiders to move out of
    # something they cannot move out of, every single pull.

    tank_busters:
      - {spell_id: 143385, name: "Electrostatic Charge", expect_cooldown: true}
      # Magnetic Crush is a stacking tank debuff, not avoidable damage. It is
      # deliberately NOT in the avoidable list: 468 hits in one pull would make
      # every tank look like the worst player in the raid.
      - {spell_id: 144466, name: "Magnetic Crush", expect_cooldown: false}

    # Launch Sawblade (143265) was seeded here as an unverified candidate
    # because it has a cast bar. Confirmed by the raid leader on 16/08 that it
    # CANNOT be interrupted, so the tool was telling the raid to set a rotation
    # for something impossible. Removed -- do not re-add from cast-bar evidence
    # alone. This is why interruptible entries start life as verified: false.
    interruptible: []
